name: Windows pipeline checks

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - shell: pwsh
        run: ./scripts/setup_tools.ps1
      - run: python -m football_pipeline doctor
      - run: python -m pytest -q
      - run: python -m ruff check src streamlit_app.py scripts tests
      - run: python -m ruff format --check src streamlit_app.py scripts tests
      - run: python scripts/build_code_guide.py --check
      - run: python scripts/check_function_docs.py
